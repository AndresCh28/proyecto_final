<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        window.setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.hasChildNodes()) {
            root.innerHTML = '<main style="min-height:100vh;display:grid;place-content:center;padding:32px;text-align:center;font-family:Arial;color:#172554"><h2>No fue posible iniciar SIGECOM</h2><p style="max-width:760px;color:#b91c1c">' + String(event.message || 'Error desconocido') + '</p></main>'
          }
        }, 0)
      })
      window.setTimeout(function () {
        var root = document.getElementById('root')
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-content:center;padding:32px;text-align:center;font-family:Arial;color:#172554"><h2>SIGECOM no terminó de cargar</h2><p>Recarga la página. Si continúa, revisaremos el módulo que bloqueó el inicio.</p></main>'
        }
      }, 5000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
